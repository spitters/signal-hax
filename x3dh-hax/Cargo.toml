[package]
name = "x3dh-hax"
version = "0.1.0"
edition = "2021"
description = "hax-extractable Signal X3DH key agreement over a primitive trait"
license = "MIT"

[dependencies]

[dev-dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
proptest = "1"

[lints.rust]
# `cfg(kani)` is set by the Kani tool but unknown to rustc.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
