# Validation manifest: the primitive, the independent reference, its kind, the test files that
# compare the crate against it, and notes on scope.
primitive = "Signal X3DH key agreement (Signal X3DH spec, Nov 2016 rev 2024)"
reference = "x25519-dalek 2 + hkdf 0.12 / sha2 0.10 driving the Signal X3DH SK formula, byte-exact against initiate/respond"
reference_kind = "independent-crate"
test_files = ["tests/proptest_equiv.rs", "tests/subgroup_check.rs"]
notes = "proptest_equiv.rs instantiates X3dhCrypto with x25519-dalek+HKDF-SHA256 (RealX3dh), runs initiate::<RealX3dh>/respond::<RealX3dh>, and byte-matches the session key against a direct reference computation of the Signal X3DH formula over the same primitives. cross_lib.rs computes the formula with dalek/hkdf and checks RFC 7748 / RFC 5869 vectors; it asserts only type sizes against x3dh_hax and does not call the crate's protocol functions. toy_model.rs is a toy Z_65537 model. subgroup_check.rs checks the subgroup predicate (subgroup::is_subgroup_point) against curve25519-dalek 4 (MontgomeryPoint::to_edwards, EdwardsPoint::is_torsion_free) on base-point multiples, X25519 public keys, torsion points, twist points, non-canonical strings and random strings, and the input check of peer public keys (subgroup::valid_pub, the subgroup predicate with the identity 0 excluded) against the same reference; proptest_equiv.rs checks that initiate/respond reject peer keys outside the subgroup and the identity. The HKDF instance uses the info \"WhisperText\" alone, as the specification and cross_lib.rs."
