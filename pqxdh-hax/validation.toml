# Validation manifest: the primitive, the independent reference, its kind, the test files that
# compare the crate against it, and notes on scope.
primitive = "PQXDH post-quantum key agreement (Signal, September 2023)"
reference = "RustCrypto ml-kem 0.2 (FIPS 203 ML-KEM-768), x25519-dalek 2, hkdf 0.12 + sha2 0.10 (RFC 5869 HKDF-SHA256)"
reference_kind = "independent-crate"
test_files = ["tests/reference_crosscheck.rs"]
notes = "reference_crosscheck.rs instantiates the crate's generic PqxdhCrypto<1184,2400,1088> trait with ML-KEM-768 (ml-kem), X25519 (x25519-dalek) and HKDF-SHA256 (hkdf+sha2), then runs the crate's create_bundle/initiate/respond. our_adapter_agrees_with_raw_mlkem asserts that the KEM adapter matches the raw ml-kem API byte for byte on ciphertext and shared secret in both directions; full_pqxdh_protocol_* checks that Alice and Bob derive the same session key. Scope: signatures use a key-independent consistent stand-in (sign-then-verify holds); the KEM, DH and KDF are the primitives under test. cross_lib.rs and proptest_equiv.rs call the primitives directly (not the crate's functions). toy_model.rs is a toy model."
